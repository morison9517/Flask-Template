[project]
name = "case_flask"
version = "0.1.0"
description = "ハッカソン用テンプレート(Flask)"
requires-python = ">=3.13"

# ライブラリを増やすときは、ここに1行足してから
# docs/SETUP.md の「ライブラリを追加したいとき」を実行する。
dependencies = [
    "Flask",
    "python-dotenv",      # .env から設定を読み込む
    "Flask-SQLAlchemy",   # SQLを書かずにDBを操作する
    "PyMySQL",            # PythonとMySQLの通訳
    "cryptography",       # MySQL8のログイン方式に必要(PyMySQLの相棒)
    "Flask-Login",        # ログイン状態の管理
    "Flask-WTF",          # フォームの成りすまし対策(CSRF)
    "gunicorn",           # 本番用のサーバー(開発中は使わない)

    # ★まだ誰も使っていないのに入っている理由
    #
    #   Pillow は画像を扱う部品。プロフィール画像などを受け取るとき、
    #   「本当に画像か」を確かめるのに使う。
    #   拡張子が .png でも中身が別物ということがあるので、名前だけでは信用できない。
    #
    #       from PIL import Image
    #       Image.open(送られてきたファイル).verify()   # 画像でなければ例外
    #
    #   ★Django版と違い、無くてもアプリは起動する(あちらは ImageField に必須)。
    #     使わないと決めたら消してよい。
    "Pillow",
]

# 開発中だけ使う道具。本番のサーバーには入れない。
[dependency-groups]
dev = [
    "ruff",  # 書き方チェック + 自動整形
]

# 「配布するライブラリではなく、動かすアプリ」という宣言。
# これがあると uv が余計なビルドをスキップする。
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E,F=基本的な間違い / I=importの並び順 / UP=古い書き方
select = ["E", "F", "I", "UP"]
