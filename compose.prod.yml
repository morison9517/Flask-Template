# =============================================================================
# compose.prod.yml = 本番用の段取り表
#
# ▼ ★開発用(compose.yml)とは別ファイルにしてある理由
#
#   compose.yml を直接書き換えると、戻し忘れた人の手元で
#   「保存しても画面が変わらない」状態になり、原因が分からず時間を溶かします。
#   本番用は最初から別のファイルにしておき、使うときだけ指定します。
#
# ▼ 使い方
#
#       docker compose -f compose.prod.yml up -d --build     起動
#       docker compose -f compose.prod.yml logs -f            ログを見る
#       docker compose -f compose.prod.yml down               停止
#
#   ★-f compose.prod.yml を毎回付けます。付け忘れると開発用が起動します。
#   手順の全体は docs/DEPLOY.md にあります。
#
# ▼ 開発用と何が違うのか(ここが本番の勘所)
#
#   | | 開発(compose.yml) | 本番(このファイル) |
#   | --- | --- | --- |
#   | 箱 | dev | **prod** |
#   | サーバー | flask run(1人ずつ) | **gunicorn(3人同時)** |
#   | ソースの直結 | あり(保存で即反映) | **無し** |
#   | 受付 | Flask が全部やる | **Nginx が front に立つ** |
#   | DBのポート | PCから見える(3307) | **開けない** |
#   | 画像の置き場 | フォルダ | **箱の外の保管庫** |
#
#   ★「ソースの直結が無い」がいちばん大事です。
#     本番は箱の中に焼き込んだコードで動きます。直したら build し直します。
#     ここに volumes: - .:/app を書くと、焼き込んだものが隠されて起動しません。
# =============================================================================

# ★プロジェクト名を分けておく。
#   同じ名前だと開発用と本番用が同じ保管庫(DBのデータ)を共有してしまう。
name: case_flask_prod

services:
  # ===========================================================================
  # db = MySQL
  # ===========================================================================
  db:
    image: mysql:8.4

    # ★本番は always。サーバーを再起動しても自動で戻ってくる。
    #   (開発用の unless-stopped は「自分で止めたなら戻さない」の意味)
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo

    # ★ports を書いていません(開発用には 3307 がありました)。
    #   本番でここを開けると、世界中からDBに直接ログインを試されます。
    #   web の箱からは Docker の内部だけで繋がるので、開ける必要がありません。
    #
    #   ★DBeaver で本番のDBを見たくなったら、ポートを開けるのではなく
    #     SSHのトンネル越しに繋いでください(手順は docs/DEPLOY.md)。

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ===========================================================================
  # web = Flask(gunicorn)
  # ===========================================================================
  web:
    build:
      context: .
      # ★prod = gunicorn で動く本番用の箱。
      target: prod

    restart: always

    env_file:
      - .env

    environment:
      DB_HOST: db

    # ★起動時に2つのことを順にやる
    #
    #   1. init-db  … models.py の設計図どおりにDBの表を用意する
    #                 (既にある表はそのまま。データは消えません)
    #   2. gunicorn … 本番用のサーバーを起動する
    #
    #   ★Django版にある collectstatic はありません。
    #     Flaskは静的ファイルを集めないので、Nginxが src/web/static/ を直接配ります。
    #
    #   --workers 3 = 3人分の窓口。目安は「CPUの数 x 2 + 1」。
    command: >
      sh -c "flask init-db &&
             gunicorn web.app:app --bind 0.0.0.0:5000 --workers 3"

    # ★ports を書いていません。
    #   お客さんは必ず Nginx を通ります。Flask を直接には触れません。

    volumes:
      # ★ソースコードは直結しません(本番は箱に焼き込んだものを使う)。
      #   ここに - .:/app と書くと起動しなくなります。書かないでください。
      #
      # 利用者が上げたファイル(プロフィールアイコン)。
      # ★箱の外なので、build し直しても消えません。
      - media_files:/app/media

    depends_on:
      db:
        condition: service_healthy

  # ===========================================================================
  # nginx = 入口の案内係
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine

    restart: always

    ports:
      # 外から来るのはここだけ。
      # ★HTTPSにするときは 443 を足して、証明書を読ませます(docs/DEPLOY.md)。
      - "80:80"

    volumes:
      # 設定ファイル。:ro = 読むだけ(箱の中から書き換えられない)。
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # ★CSS・JSはソースのフォルダをそのまま見せる。
      #   Django版のように1か所へ集めるコマンドが無いため。
      #   :ro なので、Nginxから書き換えられる心配はありません。
      - ./src/web/static:/var/www/static:ro
      # 利用者が上げた画像。web と同じ保管庫を共有する。
      - media_files:/var/www/media:ro

    depends_on:
      - web

# =============================================================================
# 箱の外に置く保管庫
#
#   ★media_files を消すと、利用者のプロフィールアイコンが全部消えます。
#     down -v は本番では絶対に打たないでください(-v が保管庫ごと消す指定)。
# =============================================================================
volumes:
  db_data:
  media_files:
