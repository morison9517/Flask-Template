# =============================================================================
# compose.prod.yml = 本番用の段取り表
#
#   docker compose -f compose.prod.yml up -d --build     起動
#   docker compose -f compose.prod.yml logs -f           ログを見る
#   docker compose -f compose.prod.yml down              停止
#
#   ★-f compose.prod.yml を毎回付ける。付け忘れると開発用が起動する。
#   手順の全体は docs/DEPLOY.md。
#
# ▼ 開発用(compose.yml)との違い
#
#   | | 開発 | 本番 |
#   | --- | --- | --- |
#   | 箱 | dev | **prod** |
#   | サーバー | flask run(1人ずつ) | **gunicorn(3人同時)** |
#   | ソースの直結 | あり(保存で即反映) | **無し** |
#   | 受付 | Flask が全部やる | **Nginx が front に立つ** |
#   | DBのポート | PCから見える(3307) | **開けない** |
#   | 画像の置き場 | フォルダ | **箱の外の保管庫** |
#
#   ★「ソースの直結が無い」がいちばん大事です。
#     本番は箱の中に焼き込んだコードで動きます。直したら build し直します。
#     ここに volumes: - .:/app を書くと、焼き込んだものが隠されて起動しません。
# =============================================================================

# ★プロジェクト名を分ける。同じ名前だと開発用と保管庫(DBのデータ)を共有してしまう。
name: case_flask_prod

services:
  # ===========================================================================
  # db = MySQL
  # ===========================================================================
  db:
    image: mysql:26.10

    # always = サーバーを再起動しても自動で戻ってくる。
    restart: always

    # ▼ ★メモリ1GBのサーバーで動かすための設定
    #
    #   MySQL 8 は既定のままだと 800MB 近く使う。1GBの機械(t3.micro など)
    #   ではメモリが足りなくなり、OSがMySQLを強制終了する。
    #   症状は「たまに502」だけで、少し待つと勝手に直るため原因に辿り着けない。
    #   ★2GB以上のサーバーに移したら、この4行は消してよい(その分速くなる)。
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --max-connections=30
      --table-open-cache=200

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo

    # ★ports を書いていない(開発用には 3307 があった)。
    #   本番で開けると世界中からDBにログインを試される。
    #   DBeaver で見たいときは、ポートではなくSSHのトンネル越しに繋ぐ。

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ===========================================================================
  # web = Flask(gunicorn)
  # ===========================================================================
  web:
    build:
      context: .
      # ★prod = gunicorn で動く本番用の箱。
      target: prod

    restart: always

    env_file:
      - .env

    environment:
      DB_HOST: db

    # ★起動時に2つのことを順にやる
    #
    #   1. init-db  … models.py の設計図どおりにDBの表を用意する
    #                 (既にある表はそのまま。データは消えません)
    #   2. gunicorn … 本番用のサーバーを起動する
    #
    #   ★Django版にある collectstatic はありません。
    #     Flaskは静的ファイルを集めないので、Nginxが src/web/static/ を直接配ります。
    #
    #   --workers 3 = 3人分の窓口。目安は「CPUの数 x 2 + 1」。
    command: >
      sh -c "flask init-db &&
             gunicorn web.app:app --bind 0.0.0.0:5000 --workers 3"

    # ★ports を書いていません。
    #   お客さんは必ず Nginx を通ります。Flask を直接には触れません。

    volumes:
      # 利用者が上げたファイル。箱の外なので build し直しても消えない。
      # ★ここに - .:/app と書かないこと(起動しなくなる)。
      - media_files:/app/media

    depends_on:
      db:
        condition: service_healthy

  # ===========================================================================
  # nginx = 入口の案内係
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine

    restart: always

    environment:
      # 証明書を取ったドメイン。設定ファイルの中の ${HTTPS_DOMAIN} に入る。
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-}

    ports:
      # ★443 はHTTPS化前から開けておいて構わない(中で誰も待っていないだけ)。
      #   後で足し忘れると「設定は合っているのに繋がらない」で長く詰まる。
      # ★80 はHTTPS化した後も閉じないこと。証明書の更新確認がHTTPで来る。
      - "80:80"
      - "443:443"

    volumes:
      # ▼ ★HTTPとHTTPSの切り替えは、.env の HTTPS_DOMAIN だけで決まる
      #
      #     HTTPS_DOMAIN が空       → prod.conf(HTTP)
      #     HTTPS_DOMAIN=example.com → prod-https.conf(HTTPS)
      #
      #   ${HTTPS_DOMAIN:+-https} は「中身があるときだけ -https という文字になる」書き方。
      #   ★証明書を取る前に HTTPS_DOMAIN を書かないこと。Nginxが起動しなくなる。
      #   置き先が templates/ なのは、設定の中の ${HTTPS_DOMAIN} を
      #   Nginxの箱が起動時に実際のドメインへ書き換えてくれる場所だから。
      - ./docker/nginx/prod${HTTPS_DOMAIN:+-https}.conf:/etc/nginx/templates/default.conf.template:ro
      # HTTP版・HTTPS版の両方から読み込む中身。★どちらでも必要。
      - ./docker/nginx/app.inc:/etc/nginx/app.inc:ro
      # ★CSS・JSはソースのフォルダをそのまま見せる。
      #   Django版のように1か所へ集めるコマンドが無いため。
      #   :ro なので、Nginxから書き換えられる心配はありません。
      - ./src/web/static:/var/www/static:ro
      # 利用者が上げた画像。web と同じ保管庫を共有する。
      - media_files:/var/www/media:ro
      # 証明書。certbot が書き、Nginx は読むだけ。
      - certbot_conf:/etc/letsencrypt:ro
      # 更新確認の受け渡し場所。★:ro を付けないこと(certbot が書き込む)。
      - certbot_www:/var/www/certbot

    depends_on:
      - web

  # ===========================================================================
  # certbot = HTTPSの証明書を取る・更新する係(★普段は動きません)
  # ===========================================================================
  #
  #   profiles が付いているので up では起動しない。呼んだときだけ来る係。
  #
  #   取る(★ドメインとメールは自分のものに変える):
  #       docker compose -f compose.prod.yml run --rm certbot certonly   #         --webroot -w /var/www/certbot   #         -d example.com --email you@example.com --agree-tos --no-eff-email
  #
  #   更新:
  #       docker compose -f compose.prod.yml run --rm certbot renew
  #
  #   ★取る前に、HTTP(.env の HTTPS_DOMAIN が空)のまま nginx が起動していること。
  #   手順の全体は docs/DEPLOY.md の「HTTPSにする」。
  certbot:
    image: certbot/certbot:latest

    # ★この1行が「普段は動かない」の指定。消すと up のたびに起動します。
    profiles:
      - certbot

    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

# =============================================================================
# 箱の外に置く保管庫
#
#   ★down -v は本番では絶対に打たないこと(-v が保管庫ごと消す指定)。
#     media_files を消すと利用者の画像が全部消える。
#     certbot_conf を消すと証明書が消え、取り直しは「1週間に5回まで」に当たる。
# =============================================================================
volumes:
  db_data:
  media_files:
  certbot_conf:
  certbot_www:
