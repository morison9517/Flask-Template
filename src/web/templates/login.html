{# ログイン画面。

   <input name="○○"> の名前が Python 側の request.form.get("○○") と1対1で対応する。
   ★ここがズレると値が届かない。 #}
{% extends "base.html" %}

{% block content %}

<section class="auth-panel">
  <h1>ログイン</h1>

  <form method="post" action="{{ url_for('auth.login') }}" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="field">
      <label for="username">ユーザー名</label>
      <input
        type="text"
        id="username"
        name="username"
        value="{{ username or '' }}"
        required
        autocomplete="username"
        autofocus
      />
    </div>

    <div class="field">
      <label for="password">パスワード</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="current-password"
      />
    </div>

    <button type="submit" class="btn btn-primary btn-block">ログイン</button>
  </form>

  <p class="auth-switch">
    アカウントがまだない方は
    <a href="{{ url_for('auth.register') }}">新規登録</a>
  </p>
</section>

{% endblock %}
